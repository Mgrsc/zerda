# zerda minimal configuration for the bundled Compose deployment

[providers.openai]
type = "openai_chat"
api_key = "${OPENAI_API_KEY}"
base_url = "${OPENAI_BASE_URL}"

[agent]
tool_timeout = 300
disabled_primitives = []

[agent.primary_model]
model = "openai@${OPENAI_MODEL}"
vision = true

[agent.fast_model]
model = "openai@${OPENAI_FAST_MODEL}"
vision = true

# [[channels]]
# name = "telegram"
# token = "${TELEGRAM_BOT_TOKEN}"
# allowed_users = []
# max_message_length = 4096
# draft_stream_update_interval_ms = 350

# [[channels]]
# name = "wechat"
# gateway_url = "http://wechat-agent-gateway:8080"

[stt]
provider = ""
model = "whisper-large-v3-turbo"

[memory]
enabled = true

[memory.embedding]
base_url = "${OPENAI_BASE_URL}"
api_key = "${OPENAI_API_KEY}"
model = "text-embedding-3-small"
dimensions = 1536
timeout_ms = 5000

[memory.sqlite]
path = "~/.zerda/memory/ema.sqlite3"

[memory.chroma]
url = "http://chroma:8000"

[log]
level = "info"
format = "json"
debug_plaintext = false
stream_progress_interval_ms = 2000
include_target = true
