# zerda minimal configuration
# 由 zerda.toml.full 裁剪：保留常用必配项，移除非必要调参项。
# 其他配置使用代码默认值（见 zerda.toml.full）。

# =============================
# Providers
# =============================
[providers.openai]
type = "openai_chat"
api_key = "${OPENAI_API_KEY}"
base_url = ""

# =============================
# Agent
# =============================
[agent.primary_model]
model = "openai@${OPENAI_MODEL}"
vision = true

[agent.fast_model]
model = "openai@${OPENAI_FAST_MODEL}"
vision = true

# =============================
# Reflection
# =============================
[reflection]
enabled = false
llm_model = "openai@${OPENAI_REFLECTION_MODEL}"
max_tokens = 2048
embedding_model = "openai@${OPENAI_EMBEDDING_MODEL}"
embedding_dim = 1536

# =============================
# Channels
# =============================
[[channels]]
name = "telegram"
token = "${TELEGRAM_BOT_TOKEN}"
allowed_users = []
max_message_length = 4096
draft_stream_update_interval_ms = 350

# =============================
# TTS / STT
# =============================
[tts]
provider = "minimax"
api_key = "${MINIMAX_API_KEY}"
model = "speech-2.8-hd"
voice_id = "female-shaonv"

[stt]
provider = "groq"
api_key = "${GROQ_API_KEY}"
model = "whisper-large-v3-turbo"

# =============================
# Memory Service
# =============================
[memory_service]
enabled = false
url = "http://memory-service:8080"
auth_token = "${MEMBURROW_AUTH_TOKEN}"
