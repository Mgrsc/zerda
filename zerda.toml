# [providers.<id>] defines a provider endpoint.
# <id> is user-defined and used in model references: /model <id>@<model_name>

[providers.openai]
type = "openai_chat"                    # API protocol: openai_chat | openai_responses | anthropic
api_key = "${OPENAI_API_KEY}"
base_url = "${OPENAI_BASE_URL}"         # API root up to version path, e.g. https://api.openai.com/v1
                                        # the provider appends /chat/completions, /responses, or /messages
                                        # leave empty to use the official default endpoint

# [providers.anthropic]
# type = "anthropic"
# api_key = "${ANTHROPIC_API_KEY}"

[agent]
disabled_primitives = []                # primitive blacklist, e.g. ["firecrawl_search_web"]

[agent.primary_model]
model = "openai@${OPENAI_MODEL}"        # <provider_id>@<model_name>
vision = true                           # whether to send images to the model (default: true)
# temperature = 1.0                     # optional; default: unset (API decides)
# top_p = 1.0                           # optional; default: unset (API decides)
# max_tokens = 4096                     # optional; default: unset (anthropic uses 4096)

# [agent.fast_model]                    # optional; falls back to primary_model if omitted
# model = "openai@gpt-4o-mini"
# vision = false
# temperature = 1.0
# top_p = 1.0
# max_tokens = 4096

# [[channels]]
# name = "telegram"                     # currently only telegram is supported
# token = "${TELEGRAM_BOT_TOKEN}"
# allowed_users = ["*"]                 # allowed user IDs; ["*"] means all users
# max_message_length = 4096


# TTS (optional; disabled when provider is empty)
[tts]
provider = "minimax"                    # minimax
api_key = "${MINIMAX_API_KEY}"
model = "speech-2.8-hd"
voice_id = "female-shaonv"

# STT (optional; disabled when provider is empty)
[stt]
provider = "groq"                       # groq
api_key = "${GROQ_API_KEY}"
model = "whisper-large-v3-turbo"

# Memory service (MemBurrow; disabled by default)
[memory_service]
enabled = false
url = "http://localhost:8080"
auth_token = "${MEMBURROW_AUTH_TOKEN}"
tenant_id = "default"
default_entity_id = "user_default"
process_id = "planner"
recall_timeout_ms = 3000
recall_top_k = 8
recall_min_score = 0.7
ingest_batch_turns = 3
ingest_timeout_ms = 10000
ingest_max_retries = 2
