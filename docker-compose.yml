services:
  zerda:
    image: ghcr.io/mgrsc/zerda:latest
    pull_policy: always
    init: true
    hostname: e-desert
    working_dir: /root/.zerda
    restart: unless-stopped
    env_file: .env
    environment:
      - ZERDA_CONFIG=/root/.zerda/zerda.toml
    volumes:
      - zerda-data:/root/.zerda
      - ./zerda.toml:/root/.zerda/zerda.toml
      - ./identity.md:/root/.zerda/identity.md
      - ./custom_primitives:/root/.zerda/custom_primitives
    depends_on:
      - chroma
      - wechat-agent-gateway

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma

  wechat-agent-gateway:
    image: ghcr.io/mgrsc/wechat-agent-gateway:latest
    restart: unless-stopped
    volumes:
      - wechat-agent-gateway-data:/data

volumes:
  zerda-data:
  chroma-data:
  wechat-agent-gateway-data:
