[package]
name = "zerda"
version = "0.1.0-beta.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Mgrsc/zerda"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "io-std", "fs", "signal"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "0.15", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
regex = "1"
base64 = "0.22"
dirs = "6"
toml = "1.0.1"
futures = "0.3.32"
tokio-util = { version = "0.7.18", features = ["rt"] }
hex = "0.4"
serde_yaml = "0.9.34"
chrono = "0.4.43"
bytes = "1.11.1"
uuid = { version = "1.21.0", features = ["v4"] }
qdrant-client = "1.17"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
proptest = "1.10.0"
